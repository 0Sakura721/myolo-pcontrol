plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.myolo.pcontrol'
    compileSdk 34

    signingConfigs {
        // 固定 debug 签名（仓库内 myolo-debug.keystore，学习项目专用；
        // 正式发布请改为环境变量/SECRET 注入，勿提交释放密钥）
        debug {
            storeFile file("../myolo-debug.keystore")
            storePassword "myolo123456"
            keyAlias "myolo"
            keyPassword "myolo123456"
        }
    }

    defaultConfig {
        applicationId "com.myolo.pcontrol"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // 仅打包这两种 ABI，减小 APK 体积
        ndk {
            abiFilters.addAll(["arm64-v8a", "armeabi-v7a"])
        }

        // CMake 构建参数
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // 指向 C++ 源码的 CMake 构建脚本
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // 说明：NCNN 不通过 Gradle 依赖引入，改用 CMake 链接预编译 .so + headers
}
