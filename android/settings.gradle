// 项目设置文件
pluginManagement {
    repositories {
        google()          // Android 插件 / AndroidX 依赖
        mavenCentral()    // 通用 Maven
        gradlePluginPortal() // Gradle 插件端口
    }
}

dependencyResolutionManagement {
    // 统一在此处声明仓库，禁止子模块自行声明
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "MyoloPcontrol"
include ':app'
